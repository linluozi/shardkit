[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shardkit"
version = "0.2.0"
description = "Consistent hashing with auditable bounded-load and failure-domain-aware placement"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]

[tool.setuptools]
packages = ["shardkit"]
